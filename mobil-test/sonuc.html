<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test sonucu</title>
<body style="font:15px/1.5 -apple-system,sans-serif;padding:14px"><h1 style="font-size:19px">Test kayıtları</h1><pre id="o" style="white-space:pre-wrap;font-size:11px;line-height:1.25"></pre>
<script>var out=[];try{var h=JSON.parse(localStorage.getItem('berlinDiagPrev')||'[]');var r=localStorage.getItem('berlinDiag');if(r){var o=JSON.parse(r);h.push({page:o.page,start:o.start,ms:o.ms,decodedMB:o.decodedMB,maxDecodedMB:o.maxDecodedMB,nodes:o.nodes,longest:o.longest,url:o.url,last:o.last.slice(-12)});}h.slice(-3).forEach(function(x,i){out.push('#'+(i+1)+' '+x.page+' '+String(x.start).slice(11,19)+' ms='+x.ms+' MB='+x.decodedMB+'/'+x.maxDecodedMB+' dugum='+x.nodes+' takilma='+x.longest+' '+(x.url||''));(x.last||[]).forEach(function(l){out.push('  '+l)});});}catch(e){out.push('hata '+e)}document.getElementById('o').textContent=out.length?out.join('\n'):'Kayıt yok';</script></body></html>
