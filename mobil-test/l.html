<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test listesi</title>
<body style="font:13px/1.3 -apple-system,sans-serif;padding:10px;margin:0"><div id="o">Yükleniyor…</div>
<script>
fetch('list.json').then(function(r){return r.json()}).then(function(d){
  var K='berlinTur';if(localStorage.getItem(K)!==d.note){localStorage.setItem(K,d.note);localStorage.removeItem('berlinRuns');}
  var runs={};try{runs=JSON.parse(localStorage.getItem('berlinRuns')||'{}');}catch(e){}
  var h='<b>'+d.note+'</b> <a href="sonuc.html">sonuç</a> <a href="javascript:localStorage.removeItem(\'berlinRuns\');location.reload()">sıfırla</a><br>',next=null;
  d.pages.forEach(function(p){var r=runs[p.f.split('#')[0]]||[];if(!r.length&&!next)next=p.f;
    h+='<div style="margin:5px 0;padding:5px;background:#eee;border-radius:6px"><a href="'+p.f+'"><b>'+p.t+'</b></a>'+r.map(function(x){var ok=/SAĞ/.test(x.l);return '<div style="color:'+(ok?'#070':'#b00')+'">'+(ok?'SAĞ ':'ÖLDÜ ')+x.t+' '+x.ms+'ms · '+x.l.replace(/</g,'&lt;')+'</div>'}).join('')+'</div>';});
  h+=next?'<p>Sıradaki: '+next+'</p>':'<p><b>TUR BİTTİ</b></p>';
  document.getElementById('o').innerHTML=h;
  if(next)setTimeout(function(){location.href=next;},1500);
}).catch(function(e){document.getElementById('o').textContent='Hata: '+e;});
</script></body></html>
